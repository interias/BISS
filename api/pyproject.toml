[project]
name = "biss-api"
version = "0.1.0"
description = "BISS backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: needs a real LLM token"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
