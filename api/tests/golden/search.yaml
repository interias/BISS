    kind: brand
  - query: Haferdrink
    expected: C660000
    kind: generic
  - query: vollkornbrot
    expected: B101000
    kind: generic
  - query: Joghurt
    expected: M141300  # the cached "Joghurt natur" of Testhof ranks behind: OFF comes last
    kind: generic
  - query: Ei
    expected: fixture:ei_own  # eaten 7 times; the unused, shorter "Ei roh" wins on text alone
    kind: usage
  - query: Käse
    expected: fixture:kaese_own  # eaten 6 times; the unused, shorter "Käse Edam" wins on text alone
    kind: usage
  - query: Brot
    expected: fixture:brot_own  # eaten 8 times; the unused "Brot Roggen" wins on a tie in text
    kind: usage
  - query: Testmüsli Krokant
    expected: cache:muesli_krokant  # only in the cache
    kind: off
  - query: testmusli
    expected: cache:muesli_krokant
    kind: off
  - query: Bergquell Haferdrink
    expected: cache:haferdrink_bergquell  # the cached brand is a known brand and filters
    kind: off
  - query: Almwiese Kefir
    expected: fixture:kefir_recent  # the cached Almwiese kefir is 45 days old, not found
    kind: off
  - query: Haferdrink Original
    expected: fixture:haferdrink_alpro  # the food, not the cache row of its GTIN
    kind: off
