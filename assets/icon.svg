      <circle cx="256" cy="262" r="156" fill="#fff"/>
      <circle cx="386.1" cy="131.9" r="58"/>
      <circle cx="398.2" cy="188.6" r="31"/>
      <circle cx="360.7" cy="184.0" r="31"/>
      <circle cx="334.0" cy="157.3" r="31"/>
      <circle cx="329.4" cy="119.8" r="31"/>
