<!doctype html>
<!-- Source of social-preview.png (1280x640). Render: chrome --headless --window-size=1280,640 --screenshot -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=block">
<style>
  :root{--bg:#EDF0EA;--surface:#FFFFFF;--surface-2:#F4F6F1;--ink:#17201A;--muted:#5C665E;--line:#D8DDD3;
    --accent:#B3245F;--accent-soft:#F6DCE7;--prot:#2F64D6;--carb:#C98E00;--fat:#23926A}
  *{box-sizing:border-box;margin:0}
  html,body{width:1280px;height:640px;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:'Figtree',sans-serif;
    display:grid;grid-template-columns:1fr 440px;gap:64px;align-items:center;padding:0 110px}
  .num{font-variant-numeric:tabular-nums}
  .brand{display:flex;align-items:center;gap:28px}
  .brand img{width:128px;height:128px}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:148px;letter-spacing:.06em;line-height:1}
  .acro{margin-top:30px;font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:34px;color:var(--muted);letter-spacing:.01em}
  .acro b{color:var(--accent);font-weight:800}
  .claim{margin-top:22px;font-size:25px;line-height:1.4;color:var(--ink);max-width:560px}
  .card{background:var(--surface);border:1px solid #C9CFC4;border-radius:32px;padding:34px 34px 30px;
    box-shadow:0 30px 60px -30px rgba(23,32,26,.28)}
  .sum{display:grid;grid-template-columns:168px 1fr;gap:26px;align-items:center}
  .ring{position:relative;width:168px;height:168px}
  .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;line-height:1}
  .ring .small{color:var(--muted);font-size:14px;margin-top:5px}
  .macro{margin-bottom:16px}.macro:last-child{margin-bottom:0}
  .row{display:flex;justify-content:space-between;font-size:16px;margin-bottom:7px}
  .row span:first-child{font-weight:600}.row span:last-child{color:var(--muted)}
  .bar{height:9px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:5px}
  .chips{display:flex;gap:10px;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
  .chip{padding:9px 16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:16px;font-weight:600;white-space:nowrap}
  .chip small{color:var(--muted);font-weight:500;font-size:15px}
  .chip.on{background:var(--accent-soft);border-color:var(--accent)}
</style>
<div>
  <div class="brand"><img src="icon.svg" alt=""><h1>BISS</h1></div>
  <p class="acro"><b>B</b>arcode · <b>I</b>mage · <b>S</b>can · <b>S</b>ave</p>
  <p class="claim">Selbst gehostete Ernährungs-Erfassung. Bekanntes mit einem Tap, Neues mit einem Foto.</p>
</div>
<div class="card">
  <div class="sum">
    <div class="ring">
      <svg width="168" height="168" viewBox="0 0 132 132">
        <circle cx="66" cy="66" r="56" fill="none" stroke="#F4F6F1" stroke-width="12"/>
        <circle cx="66" cy="66" r="56" fill="none" stroke="#D8DDD3" stroke-width="1"/>
        <circle cx="66" cy="66" r="56" fill="none" stroke="#B3245F" stroke-width="12" transform="rotate(-90 66 66)" stroke-dasharray="228.7 999"/>
        <circle cx="66" cy="66" r="56" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-dasharray="1.4 7.3" transform="rotate(-90 66 66)"/>
      </svg>
      <div class="c"><span class="big num">1.560</span><span class="small num">von 2.400 kcal</span></div>
    </div>
    <div>
      <div class="macro"><div class="row num"><span>Eiweiß</span><span><b style="color:var(--ink)">118</b> / 160 g</span></div><div class="bar"><i style="width:74%;background:var(--prot)"></i></div></div>
      <div class="macro"><div class="row num"><span>KH</span><span><b style="color:var(--ink)">171</b> / 260 g</span></div><div class="bar"><i style="width:66%;background:var(--carb)"></i></div></div>
      <div class="macro"><div class="row num"><span>Fett</span><span><b style="color:var(--ink)">38</b> / 75 g</span></div><div class="bar"><i style="width:51%;background:var(--fat)"></i></div></div>
    </div>
  </div>
  <div class="chips">
    <span class="chip on">Skyr <small class="num">250 g</small></span>
    <span class="chip">Haferflocken <small class="num">60 g</small></span>
  </div>
</div>
