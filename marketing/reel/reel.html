<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BISS in 90 Sekunden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* The frame around the filmed app: a 9:16 reel, 540 x 960 CSS px (rendered at 2x). The phone's
   screen is a hole; build_reel.py lays out/app.mp4, the real app filmed by capture_app.py,
   underneath it. render(t) draws any moment, from out/capture.json. Light theme only. */
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --ink:#17201A; --muted:#5C665E; --line:#D8DDD3;
  --accent:#B3245F; --accent-soft:#F6DCE7; --ok:#23926A; --frame:#C9CFC4; --shadow:rgba(23,32,26,.16);
  --font-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --paper:radial-gradient(120% 60% at 100% 0%,#F6DCE7 0%,transparent 55%),radial-gradient(90% 50% at 0% 100%,#D6EEF0 0%,transparent 60%),var(--bg);
}
html,body{margin:0;height:100%;background:#0B0E0C;overflow:hidden}
html.capture,html.capture body{background:transparent}
*{box-sizing:border-box}
.num{font-variant-numeric:tabular-nums}
.reel{position:absolute;left:0;top:0;width:540px;height:960px;overflow:hidden;transform-origin:0 0;color:var(--ink);font-family:var(--font-body)}
.paper{position:absolute;inset:0;background:var(--paper)}

/* The phone: a bezel around the hole at 104,202 (330 x 653, the app's 384 x 760 at .859) */
.phone{position:absolute;left:95px;top:193px;width:348px;height:671px;border:9px solid var(--frame);border-radius:38px;box-shadow:0 34px 60px -22px rgba(23,32,26,.35)}
.preview .phone{background:#fff}

/* Progress, head and counter */
.rail{position:absolute;left:20px;right:20px;top:16px;display:flex;gap:4px}
.rail i{flex:1;height:4px;border-radius:2px;background:rgba(23,32,26,.12);overflow:hidden}
.rail b{display:block;height:100%;width:0;background:var(--accent)}
.head{position:absolute;left:28px;right:28px;top:38px;height:148px}
.panel{position:absolute;left:0;top:0;right:112px;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:9px;opacity:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0;display:flex;gap:8px;align-items:center}
.new{font-size:11px;letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:var(--accent);color:#fff}
.panel h2,.finale h2{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:.98;margin:0;letter-spacing:-.015em}
.budget{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;height:32px;padding:0 13px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px;white-space:nowrap}
.taps{display:flex;gap:6px}
.taps i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block}
.taps i.on{background:var(--accent);transform:scale(1.15)}
.counter{position:absolute;right:0;top:50%;transform:translateY(-50%);width:100px;height:100px;border-radius:26px;background:var(--surface);box-shadow:0 14px 30px -16px var(--shadow);
  display:grid;place-items:center;align-content:center;opacity:0}
.counter b{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1;color:var(--accent)}
.counter span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}

/* Cards that cover the phone: intro, finale, end */
.card{position:absolute;inset:0;background:var(--paper);opacity:0}
.intro{display:grid;place-items:center;opacity:1}
.intro-in{display:grid;justify-items:center;gap:16px;margin-top:-40px}
.intro-in > svg{width:150px;height:150px;filter:drop-shadow(0 18px 28px var(--shadow))}
.intro h1{font-family:var(--font-display);font-weight:800;font-size:112px;letter-spacing:.08em;margin:0;line-height:.9;display:flex}
.intro h1 span{display:inline-block}
.intro p{margin:0;font-size:21px;color:var(--muted);font-weight:700}
.tagnew{display:inline-flex;gap:8px;align-items:center;height:38px;padding:0 16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;font-size:15px}
.fhead{position:absolute;left:28px;right:28px;top:62px;display:grid;gap:9px}
.list{position:absolute;left:28px;right:28px;top:200px;background:var(--surface);border-radius:28px;padding:14px 22px 10px;box-shadow:0 30px 60px -28px var(--shadow)}
.list ul{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:24px 1fr auto 30px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);opacity:0}
.list li span{font-weight:700;font-size:17px}
.list li small{color:var(--muted);font-size:12.5px;font-weight:600;text-align:right}
.list li b{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--accent);text-align:right}
.list li svg{color:var(--ok)}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px;opacity:0}
.sum span{font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sum b{font-family:var(--font-display);font-weight:800;font-size:34px;color:var(--accent)}
.end{display:grid;place-items:center}
.end-in{display:grid;justify-items:center;gap:20px;text-align:center;padding:0 30px}
.end svg.logo{width:130px;height:130px;filter:drop-shadow(0 18px 28px var(--shadow))}
.end h2{font-family:var(--font-display);font-weight:800;font-size:56px;margin:0;line-height:1;text-wrap:balance}
.stats{display:flex;gap:30px;justify-content:center;margin:8px 0}
.stats div{display:grid;gap:2px}
.stats b{font-family:var(--font-display);font-weight:800;font-size:44px;color:var(--accent);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.modes{display:flex;gap:10px}
.modes span{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:999px;background:var(--surface);font-weight:800;font-size:16px;box-shadow:0 10px 20px -14px var(--shadow)}
.modes svg{color:var(--accent)}

/* Cursor, subtitle, confetti */
.cursor{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:color-mix(in srgb,var(--ink) 22%,transparent);border:2.5px solid var(--surface);box-shadow:0 4px 14px var(--shadow);opacity:0}
.ripple{position:absolute;left:0;top:0;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:3px solid var(--accent);opacity:0}
.subline{position:absolute;left:24px;right:24px;top:880px;height:66px;display:grid;place-items:center;margin:0}
.subline span{display:inline-block;max-width:100%;padding:8px 14px;border-radius:14px;background:rgba(23,32,26,.86);color:#fff;font-size:18px;font-weight:700;line-height:1.25;text-align:center;text-wrap:balance;opacity:0}
.subline span.user{background:var(--accent)}
canvas.confetti{position:absolute;inset:0;width:540px;height:960px}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="logo" viewBox="0 0 512 512">
      <mask id="cookie" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
        <circle cx="256" cy="262" r="156" fill="#fff"/>
        <path d="M232 92 L262 128 L254 156 L292 168 L300 198 L336 204 L348 236 L392 240 L430 256 L560 256 L560 -40 L232 -40 Z" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
      </mask>
      <rect width="512" height="512" rx="116" fill="#B3245F"/>
      <rect width="512" height="512" fill="#FFFFFF" mask="url(#cookie)"/>
      <g fill="#B3245F"><circle cx="196" cy="230" r="15"/><circle cx="176" cy="318" r="13"/><circle cx="262" cy="334" r="15"/><circle cx="330" cy="300" r="12"/><circle cx="244" cy="262" r="10"/></g>
    </symbol>
    <symbol id="i-cam" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-tap" viewBox="0 0 24 24"><path d="M9 11V5.5a1.8 1.8 0 0 1 3.6 0V11m0-1.2a1.8 1.8 0 0 1 3.6 0V12m0-1a1.8 1.8 0 0 1 3.6 0v4a7 7 0 0 1-7 7h-.8a6 6 0 0 1-4.6-2.2L4.6 16a1.8 1.8 0 0 1 2.8-2.3L9 15.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="reel" id="reel">
  <div class="paper" id="paper"></div>
  <div class="phone"></div>
  <div class="rail" id="rail"></div>
  <section class="head" id="head">
    <div class="counter" id="counter"><b class="num" id="count">0</b><span>Taps</span></div>
  </section>

  <div class="card finale" id="finale">
    <div class="fhead"><p class="eyebrow" id="fEyebrow"></p><h2 id="fTitle"></h2></div>
    <div class="list"><ul id="checklist"></ul><div class="sum" id="sum"><span>Zusammen</span><b class="num" id="sumN">0 Taps</b></div></div>
  </div>

  <div class="card intro" id="intro">
    <div class="intro-in">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <defs><mask id="biteMask"><rect width="512" height="512" fill="#fff"/><circle id="biteC" cx="470" cy="42" r="0" fill="#000"/><circle id="biteC2" cx="380" cy="10" r="0" fill="#000"/></mask></defs>
        <g mask="url(#biteMask)"><use href="#logo"/></g>
      </svg>
      <h1 id="introWord"><span>B</span><span>I</span><span>S</span><span>S</span></h1>
      <p id="introTag">Dein Essen. Weniger Taps.</p>
      <span class="tagnew" id="introNew"><svg width="18" height="18"><use href="#i-mic"/></svg>Jetzt auch per Sprache</span>
    </div>
  </div>

  <div class="card end" id="end">
    <div class="end-in">
      <svg class="logo" aria-hidden="true"><use href="#logo"/></svg>
      <h2>Weniger tippen. Mehr genießen.</h2>
      <div class="stats">
        <div><b class="num" id="stA">0</b><span>Wege</span></div>
        <div><b class="num" id="stB">0</b><span>Taps</span></div>
        <div><b class="num" id="stC">0</b><span>kcal</span></div>
      </div>
      <div class="modes">
        <span id="md0"><svg width="18" height="18"><use href="#i-tap"/></svg>Tippen</span>
        <span id="md1"><svg width="18" height="18"><use href="#i-cam"/></svg>Scannen</span>
        <span id="md2"><svg width="18" height="18"><use href="#i-mic"/></svg>Sprechen</span>
      </div>
    </div>
  </div>

  <p class="subline"><span id="subText"></span></p>
  <div class="cursor" id="cursor"></div>
  <div class="ripple" id="ripple"></div>
  <canvas class="confetti" id="confetti" width="1080" height="1920"></canvas>
</div>

<script>
'use strict';
const T = 90;
// The hole for the app: its 384 x 760 CSS px scaled into the phone.
const HOLE = {x:104, y:202, w:330, h:653, r:29}, APP = {w:384, h:760};
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = p => 1 - Math.pow(1 - p, 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, d = .25) => ease(seg(t, a, a + d)) * (1 - ease(seg(t, b, b + d)));
const de = n => Math.round(n).toLocaleString('de-DE');

/* ---- Titles and budgets (SPEC 1) per captured scene, and the voice-over ---- */
const WAYS = {
  recent:{title:'Zuletzt-Chip', budget:'1 Tap'},
  combo:{title:'Schnellzugriff', budget:'1 Tap'},
  empty:{title:'Leere Suche', budget:'Suche + 2'},
  search:{title:'Suche', budget:'Suche + 2'},
  barcode:{title:'Barcode', budget:'Kamera + 1'},
  label:{title:'Etikett-Foto', budget:'Kamera + Auslöser + 2'},
  plate:{title:'Teller-Foto', budget:'Kamera + Auslöser + 1'},
  dictate:{title:'Diktieren', budget:'Mikrofon + Fertig + 1', isNew:true},
  recipe:{title:'Rezept', budget:'Kochbuch + 2'},
  addfood:{title:'Zutat ergänzen', budget:'Aufklappen + 3'},
};
const VO = [
  {id:'intro', start:.8, text:'Essen eintragen? Mit BISS geht das schneller, als du denkst.'},
  {id:'recent', start:5.4, text:'Morgens die Haferflocken: ein Tap auf den Chip. Fertig.'},
  {id:'combo', start:11.4, text:'Dein festes Frühstück ist ein Schnellzugriff. Auch nur ein Tap.'},
  {id:'empty', start:17.4, text:'Suche öffnen, und BISS weiß schon, was du wahrscheinlich willst.'},
  {id:'search', start:23.4, text:'Etwas Neues? Kurz tippen, Treffer wählen, die Menge steht schon da.'},
  {id:'barcode', start:30.4, text:'Packung vor die Kamera. Der Barcode wird erkannt, ganz ohne Auslösen.'},
  {id:'label', start:36.4, text:'Unbekanntes Produkt? Ein Foto vom Etikett, und die Nährwerte sind drin.'},
  {id:'plate', start:44.4, text:'Sogar dein Teller wird erkannt. Zutaten, Mengen, eine Bestätigung.'},
  {id:'dictate', start:51.4, text:'Ganz neu: Sag einfach, was du gegessen hast.'},
  {id:'user', start:55.0, text:'„Zwei Scheiben Brot mit Käse und ein Kaffee.“', user:true},
  {id:'dictate2', start:59.4, text:'BISS macht daraus ein Gericht. Kurz prüfen, eintragen.'},
  {id:'recipe', start:63.5, text:'Deine eigenen Rezepte? Kochbuch auf, Lasagne wählen, eine Portion.'},
  {id:'addfood', start:69.4, text:'Noch eine Banane zum Frühstück? Gericht aufklappen, Zutat ergänzen.'},
  {id:'finale', start:76.6, text:'Zehn Wege, Essen einzutragen. Tippen, scannen oder einfach sprechen.'},
  {id:'outro', start:84.4, text:'BISS. Weniger tippen. Mehr genießen.'},
];
VO.forEach(v => v.dur = 3.5);

// Filled from out/capture.json: the scenes, every tap with its place, the day's kcal.
let SCENES = [], TAPS = [], TOTAL = 0, FIN = 76, WAYCOUNT = 0;

function setup(cap){
  SCENES = cap.scenes;
  FIN = SCENES.find(s => s.id === 'finale').start;
  TAPS = cap.taps.map(x => ({...x, x: HOLE.x + x.x * HOLE.w / APP.w, y: HOLE.y + x.y * HOLE.h / APP.h}));
  TOTAL = cap.totals.kcal;
  const ways = SCENES.filter(s => WAYS[s.id]), n = id => TAPS.filter(x => x.scene === id).length;
  WAYCOUNT = ways.length;
  ways.forEach((s, i) => {
    const w = WAYS[s.id], p = document.createElement('div');
    p.className = 'panel'; p.dataset.scene = s.id;
    p.innerHTML = `<p class="eyebrow">Weg ${i + 1} von ${ways.length}${w.isNew ? '<span class="new">Neu</span>' : ''}</p><h2>${w.title}</h2>
      <div class="budget"><span class="pill">${w.budget}</span><span class="taps">${'<i></i>'.repeat(n(s.id))}</span></div>`;
    $('#head').appendChild(p);
  });
  $('#rail').innerHTML = SCENES.slice(1).map(() => '<i><b></b></i>').join('');
  $('#fEyebrow').textContent = `Ein Tag, ${ways.length} Wege`;
  $('#fTitle').textContent = `${TAPS.length} Taps für alles.`;
  $('#checklist').innerHTML = ways.map(s =>
    `<li><svg width="20" height="20"><use href="#i-check"/></svg><span>${WAYS[s.id].title}</span><small>${WAYS[s.id].budget}</small><b>${n(s.id)}</b></li>`).join('');
}

// The paper around the phone has a hole, so the filmed app shows through.
function cutHole(){
  const {x, y, w, h, r} = HOLE;
  const d = `M0 0H540V960H0Z M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='540' height='960'><path fill-rule='evenodd' d='${d}'/></svg>`;
  $('#paper').style.webkitMaskImage = $('#paper').style.maskImage = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}

/* ---- Render one frame from time t ---- */
const css = (el, o, tf) => { el.style.opacity = o; if (tf !== undefined) el.style.transform = tf; };

function render(t){
  // Intro
  const out = ease(seg(t, 4.0, 4.6));
  css($('#intro'), 1 - out);
  $('.intro-in').style.transform = `scale(${1 - .15 * out})`;
  $('#biteC').setAttribute('r', 80 * ease(seg(t, .5, .8)));
  $('#biteC2').setAttribute('r', 55 * ease(seg(t, .75, 1.05)));
  $$('#introWord span').forEach((s, i) => css(s, ease(seg(t, 1 + i * .12, 1.35 + i * .12)), `translateY(${(1 - ease(seg(t, 1 + i * .12, 1.4 + i * .12))) * 40}px)`));
  css($('#introTag'), ease(seg(t, 1.8, 2.3)));
  css($('#introNew'), ease(seg(t, 2.5, 2.9)), `scale(${.8 + .2 * ease(seg(t, 2.5, 2.9))})`);

  // Head, counter, rail
  css($('#counter'), ease(seg(t, 5, 5.5)) * (1 - ease(seg(t, FIN, FIN + .4))));
  const last = TAPS.findLast(x => x.t <= t);
  $('#count').textContent = TAPS.filter(x => x.t <= t).length;
  $('#count').style.transform = `scale(${1 + .25 * (last ? win(t, last.t, last.t + .1, .1) : 0)})`;
  $$('.panel').forEach(p => {
    const s = SCENES.find(x => x.id === p.dataset.scene), v = win(t, s.start + .1, s.end - .35, .4);
    css(p, v, `translateY(${(1 - v) * 18}px)`);
    const own = TAPS.filter(x => x.scene === s.id);
    p.querySelectorAll('.taps i').forEach((d, i) => d.classList.toggle('on', own[i].t <= t));
  });
  $$('.rail b').forEach((b, i) => b.style.width = seg(t, SCENES[i + 1].start, SCENES[i + 1].end) * 100 + '%');

  renderCursor(t);

  // Subtitle
  const vo = VO.find(v => t >= v.start && t < v.start + v.dur + .25);
  const sv = vo ? win(t, vo.start, vo.start + vo.dur + .05, .2) : 0;
  css($('#subText'), sv, `translateY(${(1 - sv) * 8}px)`);
  if (vo) { $('#subText').textContent = vo.text; $('#subText').className = vo.user ? 'user' : ''; }

  // Finale: the checklist over the phone, then the end card
  const fv = ease(seg(t, FIN + .2, FIN + .7));
  css($('#finale'), fv);
  $('.list').style.transform = `translateY(${(1 - fv) * 30}px)`;
  const items = $$('#checklist li');
  items.forEach((li, i) => { const q = ease(seg(t, FIN + .8 + i * .42, FIN + 1.2 + i * .42)); css(li, q, `translateX(${(1 - q) * -14}px)`); });
  const s0 = FIN + 1.2 + items.length * .42;
  css($('#sum'), ease(seg(t, s0, s0 + .4)));
  $('#sumN').textContent = `${Math.round(TAPS.length * ease(seg(t, s0, s0 + 1)))} Taps`;
  const e0 = FIN + 7.5, ev = ease(seg(t, e0, e0 + .6));
  css($('#end'), ev);
  $('.end-in').style.transform = `translateY(${(1 - ev) * 20}px)`;
  $('#stA').textContent = Math.round(WAYCOUNT * ease(seg(t, e0 + .9, e0 + 1.9)));
  $('#stB').textContent = Math.round(TAPS.length * ease(seg(t, e0 + 1, e0 + 2.1)));
  $('#stC').textContent = de(TOTAL * ease(seg(t, e0 + 1.1, e0 + 2.4)));
  ['#md0', '#md1', '#md2'].forEach((m, i) => { const q = ease(seg(t, e0 + 3.1 + i * .3, e0 + 3.5 + i * .3)); css($(m), q, `translateY(${(1 - q) * 12}px)`); });
  drawConfetti(t, e0 + .9);
}

function renderCursor(t){
  const cur = $('#cursor'), rip = $('#ripple');
  const groups = {};
  TAPS.forEach(x => (groups[x.scene] ||= []).push(x));
  const g = Object.values(groups).find(g => t >= g[0].t - 1.1 && t <= g[g.length - 1].t + .6);
  if (!g) css(cur, 0);
  else {
    const rest = [HOLE.x + HOLE.w * .82, HOLE.y + HOLE.h * .68];
    let i = g.findIndex(x => x.t >= t - .12); if (i < 0) i = g.length - 1;
    const to = [g[i].x, g[i].y], from = i > 0 ? [g[i - 1].x, g[i - 1].y] : rest;
    const m = ease(seg(t, g[i].t - .75, g[i].t - .12));
    const x = from[0] + (to[0] - from[0]) * m, y = from[1] + (to[1] - from[1]) * m;
    const press = 1 - .25 * win(t, g[i].t - .08, g[i].t + .02, .06);
    const v = Math.min(ease(seg(t, g[0].t - 1.1, g[0].t - .8)), 1 - ease(seg(t, g[g.length - 1].t + .3, g[g.length - 1].t + .6)));
    css(cur, v, `translate(${x}px,${y}px) scale(${press})`);
  }
  const last = TAPS.findLast(x => x.t <= t);
  const rp = last ? seg(t, last.t, last.t + .45) : 1;
  css(rip, last && rp < 1 ? 1 - rp : 0, last ? `translate(${last.x}px,${last.y}px) scale(${.3 + rp})` : undefined);
}

/* Confetti: positions are a pure function of t */
const palette = ['#B3245F', '#2F64D6', '#C98E00', '#23926A', '#0E7C86'];
let rnd = 7; const R = () => (rnd = (rnd * 16807) % 2147483647) / 2147483647;
const BITS = Array.from({length:160}, () => ({x:R(), vx:(R() - .5) * .9, vy:-(.6 + R() * .9), rot:R() * 6, vr:(R() - .5) * 10, c:Math.floor(R() * 5), w:10 + R() * 10}));
function drawConfetti(t, t0){
  const cv = $('#confetti'), cx = cv.getContext('2d');
  cx.clearRect(0, 0, cv.width, cv.height);
  const dt = t - t0;
  if (dt < 0 || dt > 4.5) return;
  const W = cv.width, H = cv.height;
  cx.globalAlpha = 1 - seg(dt, 3.3, 4.5);
  BITS.forEach(b => {
    const x = (b.x * .8 + .1) * W + b.vx * dt * W * .5;
    const y = H * .5 + (b.vy * dt + .55 * dt * dt) * H * .45;
    cx.save(); cx.translate(x, y); cx.rotate(b.rot + b.vr * dt);
    cx.fillStyle = palette[b.c]; cx.fillRect(-b.w / 2, -b.w / 4, b.w, b.w / 2); cx.restore();
  });
}

/* ---- API for build_reel.py ---- */
window.REEL = {
  render,
  setup(cap, durs){
    setup(cap);
    VO.forEach(v => { if (durs[v.id]) v.dur = durs[v.id]; });
    render(0);
    return {vo: VO.map(({id, start, dur}) => ({id, start, dur})), hole: HOLE};
  },
};
cutHole();
