# Test runs without published ports, so several stacks (`-p <name>`) run side by side:
#   docker compose -f compose.yaml -f compose.test.yaml run --rm web pnpm e2e
# `run` also starts the dependencies; without this file api would publish 2478.
services:
  api:
    ports: !reset []
    environment:
      # The barcode chain asks the stub, never the real Open Food Facts.
      OFF_BASE_URL: http://off-stub:8080
      # The label photo goes to the fake extractor (FAKE_DRAFT), never to a model.
      LABEL_EXTRACTOR: fake
    depends_on:
      off-stub:
        condition: service_started
  web:
    ports: !reset []
    # Real photo sets (ADR-0008), read-only: the repo set and the local one from
    # BISS_REAL_FIXTURES (default ./testdata/real, gitignored). Tests skip an empty set.
    environment:
      BISS_REPO_FIXTURES: /fixtures/real
      BISS_REAL_FIXTURES: /fixtures/local
    volumes:
      - ./api/tests/fixtures/real:/fixtures/real:ro
      - ${BISS_REAL_FIXTURES:-./testdata/real}:/fixtures/local:ro
  # Script test of the backup: run --rm backup sh /backup/test.sh (backups go to a
  # temporary directory). It needs real rows, so the api starts first with schema and seed,
  # and it places a probe file in the images volume, so that volume is writable here.
  backup:
    volumes:
      - images:/images
    depends_on:
      api:
        condition: service_healthy
  # Invented OFF answers for the e2e tests (web/e2e/off-stub); Node from the Playwright
  # image that web builds on, so no further image is needed.
  off-stub:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    command: ["node", "/stub/server.mjs"]
    volumes:
      - ./web/e2e/off-stub:/stub:ro
